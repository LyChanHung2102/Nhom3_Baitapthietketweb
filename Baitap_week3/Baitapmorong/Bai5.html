<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 5 - Product Page</title>
    <style>
        :root {
            --color-primary: #1a1a2e;
            --color-accent: #007bff;
            --color-bg: #f8f9fa;
            --spacing: 20px;
            --radius: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: var(--color-bg); color: var(--color-primary); }

        header {
            background: var(--color-primary);
            color: #fff;
            padding: 16px var(--spacing);
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Grid lớn: ảnh 60% - info 40% */
        .product-page {
            display: grid;
            grid-template-columns: 60% 40%;
            min-height: calc(100vh - 56px);
        }

        /* Ảnh sản phẩm */
        .product-images {
            padding: var(--spacing);
            display: flex;
            flex-direction: column;
            gap: var(--spacing);
        }
        .main-img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: var(--radius);
        }
        .thumb-list {
            display: flex;
            gap: 10px;
        }
        .thumb-list img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: var(--radius);
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .thumb-list img:hover { border-color: var(--color-accent); }

        /* Thông tin sản phẩm */
        .product-info {
            padding: 30px var(--spacing);
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: var(--spacing);
            border-left: 1px solid #eee;
        }
        .product-info h1 { font-size: 1.8rem; }
        .rating { color: #f5a623; font-size: 1.1rem; }
        .price { font-size: 2rem; font-weight: bold; color: var(--color-accent); }
        .price-old { font-size: 1rem; color: #999; text-decoration: line-through; margin-left: 10px; }
        .label { font-weight: bold; margin-bottom: 8px; display: block; }

        /* Size - Flexbox */
        .size-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .size-btn {
            padding: 8px 18px;
            border: 2px solid #ddd;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: bold;
            transition: border-color 0.2s, background 0.2s;
            background: #fff;
        }
        .size-btn:hover, .size-btn.active {
            border-color: var(--color-accent);
            background: var(--color-accent);
            color: #fff;
        }

        /* Màu sắc - Flexbox */
        .color-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: border-color 0.2s, transform 0.2s;
        }
        .color-dot:hover { border-color: #333; transform: scale(1.15); }

        /* Số lượng - Flexbox */
        .qty-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .qty-btn {
            width: 36px;
            height: 36px;
            border: 2px solid #ddd;
            border-radius: var(--radius);
            background: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .qty-btn:hover { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
        .qty-input {
            width: 50px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: var(--radius);
            padding: 6px;
            font-size: 1rem;
        }

        /* Nút mua */
        .buy-actions {
            display: flex;
            gap: 10px;
        }
        .btn-buy {
            flex: 1;
            padding: 14px;
            background: var(--color-accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-buy:hover { opacity: 0.85; }
        .btn-cart {
            flex: 1;
            padding: 14px;
            background: #fff;
            color: var(--color-accent);
            border: 2px solid var(--color-accent);
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .btn-cart:hover { background: var(--color-accent); color: #fff; }
    </style>
</head>
<body>
    <header>🛍️ Product Page</header>

    <div class="product-page">
        <!-- Ảnh sản phẩm -->
        <div class="product-images">
            <img class="main-img" src="https://picsum.photos/seed/prod1/800/600" alt="Sản phẩm chính">
            <div class="thumb-list">
                <img src="https://picsum.photos/seed/prod1/200/200" alt="thumb1">
                <img src="https://picsum.photos/seed/prod2/200/200" alt="thumb2">
                <img src="https://picsum.photos/seed/prod3/200/200" alt="thumb3">
                <img src="https://picsum.photos/seed/prod4/200/200" alt="thumb4">
            </div>
        </div>

        <!-- Thông tin mua hàng -->
        <div class="product-info">
            <div>
                <h1>Áo Thun Premium</h1>
                <div class="rating">★★★★☆ <span style="color:#999;font-size:0.9rem">(128 đánh giá)</span></div>
            </div>
            <div>
                <span class="price">499.000₫<span class="price-old">799.000₫</span></span>
            </div>

            <!-- Size -->
            <div>
                <span class="label">Kích thước:</span>
                <div class="size-list">
                    <button class="size-btn">S</button>
                    <button class="size-btn active">M</button>
                    <button class="size-btn">L</button>
                    <button class="size-btn">XL</button>
                    <button class="size-btn">XXL</button>
                </div>
            </div>

            <!-- Màu sắc -->
            <div>
                <span class="label">Màu sắc:</span>
                <div class="color-list">
                    <div class="color-dot" style="background:#1a1a2e" title="Đen"></div>
                    <div class="color-dot" style="background:#fff;border:2px solid #ddd" title="Trắng"></div>
                    <div class="color-dot" style="background:#007bff" title="Xanh dương"></div>
                    <div class="color-dot" style="background:#dc3545" title="Đỏ"></div>
                    <div class="color-dot" style="background:#28a745" title="Xanh lá"></div>
                </div>
            </div>

            <!-- Số lượng -->
            <div>
                <span class="label">Số lượng:</span>
                <div class="qty-control">
                    <button class="qty-btn" onclick="this.nextElementSibling.value=Math.max(1,+this.nextElementSibling.value-1)">−</button>
                    <input class="qty-input" type="number" value="1" min="1">
                    <button class="qty-btn" onclick="this.previousElementSibling.value=+this.previousElementSibling.value+1">+</button>
                </div>
            </div>

            <!-- Nút mua -->
            <div class="buy-actions">
                <button class="btn-buy">🛒 Mua ngay</button>
                <button class="btn-cart">🤍 Thêm vào giỏ</button>
            </div>
        </div>
    </div>
</body>
</html>
