<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 4 - Complex Nav Bar</title>
    <style>
        :root {
            --color-primary: #1a1a2e;
            --color-accent: #007bff;
            --color-hover: #0056b3;
            --spacing: 20px;
            --radius: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f4f8; }

        /* ===== HEADER ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--color-primary);
            padding: 0 var(--spacing);
            height: 64px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* Logo */
        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
        }
        .logo span { color: var(--color-accent); }

        /* Nav chính */
        nav ul {
            display: flex;
            list-style: none;
            gap: 5px;
        }
        nav ul li { position: relative; }
        nav ul li a {
            display: block;
            padding: 10px 16px;
            color: #ccc;
            text-decoration: none;
            border-radius: var(--radius);
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }
        nav ul li a:hover { background: var(--color-accent); color: #fff; }

        /* Dropdown */
        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #fff;
            border-radius: var(--radius);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            min-width: 180px;
            flex-direction: column;
            padding: 8px 0;
            z-index: 200;
        }
        .dropdown a {
            color: var(--color-primary) !important;
            padding: 10px 16px;
            border-radius: 0;
        }
        .dropdown a:hover { background: #f0f4f8 !important; color: var(--color-accent) !important; }
        nav ul li:hover .dropdown { display: flex; }
        .has-dropdown > a::after { content: " ▾"; font-size: 0.75rem; }

        /* Action buttons */
        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-login {
            padding: 8px 18px;
            border: 2px solid #fff;
            color: #fff;
            border-radius: var(--radius);
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }
        .btn-login:hover { background: #fff; color: var(--color-primary); }
        .btn-register {
            padding: 8px 18px;
            background: var(--color-accent);
            color: #fff;
            border-radius: var(--radius);
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-register:hover { background: var(--color-hover); }

        /* Demo content */
        .content {
            padding: 60px var(--spacing);
            text-align: center;
            color: #555;
        }
        .content h1 { font-size: 2.5rem; margin-bottom: 16px; color: var(--color-primary); }
    </style>
</head>
<body>
    <header>
        <a href="#" class="logo">My<span>Brand</span></a>

        <nav>
            <ul>
                <li><a href="#">Trang chủ</a></li>
                <li class="has-dropdown">
                    <a href="#">Dịch vụ</a>
                    <div class="dropdown">
                        <a href="#">🌐 Thiết kế Web</a>
                        <a href="#">📱 App Mobile</a>
                        <a href="#">☁️ Cloud Hosting</a>
                        <a href="#">🔒 Bảo mật</a>
                    </div>
                </li>
                <li class="has-dropdown">
                    <a href="#">Sản phẩm</a>
                    <div class="dropdown">
                        <a href="#">🛒 Cửa hàng</a>
                        <a href="#">⭐ Nổi bật</a>
                        <a href="#">🆕 Mới nhất</a>
                    </div>
                </li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">Liên hệ</a></li>
            </ul>
        </nav>

        <div class="actions">
            <a href="#" class="btn-login">Đăng nhập</a>
            <a href="#" class="btn-register">Đăng ký</a>
        </div>
    </header>

    <div class="content">
        <h1>👋 Chào mừng!</h1>
        <p>Di chuột vào <strong>Dịch vụ</strong> hoặc <strong>Sản phẩm</strong> để xem Dropdown menu.</p>
    </div>
</body>
</html>
